<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Window</title>
  </head>
  <body>
    <button onclick="openPopUP()">Open Dialog</button>

    <script>
      window.name = "myApp";

      let popup;

      function openPopUP() {
        popup = window.open("/", "auth", "width=400,height=400");

        if (popup) {
          popup.postMessage("msg", window.location.origin);

          setTimeout(() => {
            popup.close();
          }, 5000);
        }
      }

      window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) {
          return;
        }
        console.log("Message received:", event.data);
      });
    </script>
  </body>
</html>
<!-- Bhai, tumhare code ko ekdum basic se samajhte hain. Pehle ye samjho ki browser mein Parent Window aur Popup Window do alag windows ho sakti hain. Inke beech communication karne ke liye hi window.open(), window.opener aur postMessage() use hote hain. -->
