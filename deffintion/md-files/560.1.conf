worker_processes auto;
user www-data;

events {
	worker_connections 1000;
}

http {
	include mime.types;

	sendfile on;

	server {
		root /var/www/simple-website;
		autoindex on;

		error_page 404 /404.html;

		location = /about {
			try_files /about.html =404;
			error_page 404 /404-about.html;
		}

		location = /about/ {
			index /about.html;
		}

		# location / {
		# 	# index /404.html;

		# }
	}
}