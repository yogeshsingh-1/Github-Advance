    <title>Document</title>

  <body>
    <button onclick="getIdToken()">Login With Google</button>
    <script>
      const oauthUrl = "https://accounts.google.com/o/oauth2/v2/auth";
      const redirect_uri = "http://localhost:5500";
      //  ||
      // "http://localhost:4000/google/callback" ||
      // "http://localhost:5500/callback.html";
      const client_id =
        "640249440952-saeo22sdb511is4309tho9m408gbjrqj.apps.googleusercontent.com";
      const query = new URLSearchParams({
        response_type: "id_token",
        client_id: client_id,
        scope: "openid email profile",
        redirect_uri: redirect_uri,
        nonce: "1232121",
      });
      function getIdToken() {
        const url = `${oauthUrl}?${query}`;
        console.log(url);
        window.open(url, "auth", "left:500;top:300");
      }
    </script>
  </body>
