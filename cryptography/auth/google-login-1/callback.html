<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Authentication</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Inter, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;

        background:
          radial-gradient(circle at top left, #dbeafe, transparent 45%),
          radial-gradient(circle at bottom right, #ede9fe, transparent 45%),
          #f8fafc;
      }

      .callback-card {
        width: 100%;
        max-width: 400px;
        padding: 45px 30px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 22px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }

      .google-icon {
        width: 54px;
        height: 54px;
        margin-bottom: 24px;
      }

      h2 {
        color: #1e293b;
        font-size: 23px;
        margin-bottom: 12px;
      }

      .description {
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 28px;
      }

      .loader {
        width: 42px;
        height: 42px;
        margin: 0 auto 20px;
        border: 4px solid #e2e8f0;
        border-top-color: #4285f4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .status {
        color: #475569;
        font-size: 13px;
        font-weight: 500;
      }

      .secure-info {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #f1f5f9;
        color: #94a3b8;
        font-size: 11px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <main class="callback-card">
      <svg class="google-icon" viewBox="0 0 48 48">
        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
          transform="translate(0 4)"
        />
        <path
          fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.72 7.18l7.64 5.93c4.46-4.13 7.12-10.2 7.12-17.58z"
        />
        <path
          fill="#FBBC05"
          d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a24 24 0 0 0 0 21.56l7.98-6.19z"
          transform="translate(0 4)"
        />
        <path
          fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.64-5.93c-2.13 1.43-4.85 2.28-8.26 2.28-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
          transform="translate(0 -4)"
        />
      </svg>

      <h2>Completing Sign In</h2>

      <p class="description">
        Please wait while we securely authenticate your Google account.
      </p>

      <div class="loader"></div>

      <p class="status" id="status">Processing authentication...</p>

      <div class="secure-info">
        🔒 Secure authentication powered by Google OAuth 2.0
      </div>
    </main>

    <script src="./callback.js" type="module"></script>
  </body>
</html>
