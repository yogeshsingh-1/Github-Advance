<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        width: 400px;
        height: 200px;
        background-color: antiquewhite;
        position: fixed;
        inset: 0;
        margin: auto;
        z-index: 50;
        border-radius: 20px;
        /* box-shadow: 4px 8px 20px 2px rgba(0, 0, 0, 0.5); */
        /* box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); */
        /* box-shadow: 0 8px 24px rgba(0,0,0,.14); */
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.05),
          0 8px 24px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="card"></div>
    <h3>Learn PopUp</h3>
    <button onclick="openPopup()">Open Popup</button>
    <script>
      function openPopup() {
        console.log(window.innerWidth);
        console.log(window.innerHeight);
        const left = (window.outerWidth - 320) / 2;
        const top = (window.outerHeight - 300) / 2;
        const windowFeatures = `width=320,height=300,left=${left},top=${top}`;
        const popup = window.open(
          "/pop-up.html",
          "mozillaWindow",
          windowFeatures,
        );
        popup.postMessage("hi From Yogesh");
      }
      window.addEventListener("message", (event) => {
        // console.log(event);
      });
    </script>
  </body>
</html>
